# ═══════════════════════════════════════════════════════════════════
# HEROINE ALLIES (Phase 17)
# ═══════════════════════════════════════════════════════════════════

wonderland_alice:
  name: Alice
  race: Fey
  secondary_race: Storybook
  level: 1
  base_hp: 20
  mods:
    Wisdom: 4
    Dexterity: 2
    Charisma: 2
    Strength: -1
    Constitution: 0
    Learning: 0
  boss: false
  super_boss: false
  _heroine: alice
  _heroine_passive: wonderland_logic
  dialogue:
    capture: Alice blinks at you curiously, then takes your hand. 'Well! This is
      unexpected. But then, everything here is. I think I rather like unexpected.'
    recruit_denied: Alice tilts her head, studying you. 'I'm not sure I know you
      well enough yet. The last person I followed turned out to be a playing card.
      Let's... let's talk more first.'
    recruit_accepted: Alice's face brightens. 'Oh, how wonderful! I was hoping you'd
      ask. Let's go write a new chapter together — one with fewer monsters and more
      tea.'
    house_talk_low: Alice peers at you over her teacup. 'You're very quiet. Are you
      thinking about something? Or is the silence just... comfortable?'
    house_talk_mid: Alice sets down her book — upside-down, as always. 'The story
      makes more sense this way,' she explains earnestly. 'Would you like some tea?
      The pot thinks it's Tuesday.'
    house_talk_high: Alice giggles and grabs your hand. 'I tried to count the impossible
      things I believed today. I got to seven. The seventh was that you'd actually
      come back to see me.'
    house_talk_max: Alice curls up beside you, resting her head on your shoulder.
      'I used to think being lost was the worst thing. But then I got lost here.
      And I found you. So perhaps being lost isn't so bad after all.'
    house_talk_engaged_1: Alice gazes at her engagement ring, watching it catch the
      light. 'A ring is a circle, you know. No beginning, no end. Just like a good
      story. Just like us.'
    house_talk_engaged_2: Alice leans against you, smiling dreamily. 'I had a dream
      last night. A real dream, not a Wonderland one. We were sitting by a river,
      and the sky was the right colour, and you were there. I hope it was a prophecy.'
    house_gift_love: Alice gasps, cradling the gift like it might vanish. 'This is...
      this is PERFECT. How did you know? No, don't tell me. I want it to remain
      a mystery. Mysteries are the best part of any story.'
    house_gift_hate: Alice's smile wavers. 'Oh. Um. Thank you? I'm sure it's very...
      practical. I'll put it somewhere safe. Somewhere I won't find it by accident.'
    house_buff: Alice whispers something in your ear. It's not words exactly — more
      like the shape of an idea. You feel... clearer. Sharper. As if the nonsense
      of the world has parted, just a little.
    house_bond_kiss: Alice's eyes go wide. For a moment, all of Wonderland seems
      to hold its breath. 'Oh,' she whispers. 'That was... that was the most sensible
      thing that's ever happened to me.' She touches her lips, dazed.
    house_engaged: Alice stares at the ring. Her teacup clatters to the saucer. 'You're
      asking ME? The girl who followed a rabbit, who argued with flowers, who grew
      and shrank and grew again?' Tears well up — real tears, not Wonderland tears.
      'Yes. A thousand times yes. Or maybe once. Once is enough, if it's the right once.'
    house_special_gift: Alice hands you a small, wrapped package. Inside — a single
      teacup, impossibly warm. 'This is from the tea party. The one that never ends.
      As long as this cup is warm, you'll always be welcome at the table.' She fastens
      the Teacup Brooch to your collar. 'There. Now you're part of OUR story.'
    ascension_pre_ceremony: Alice kneels, her expression unusually serious. 'I've
      been small and I've been tall. I've been lost and I've been found. But I've
      never been... enough. Please. Help me break the limits of my story.'
    ascension_post_ceremony: The {stone} dissolves into a shower of golden letters
      — words that rearrange themselves mid-air. {name} rises, eyes shining. 'Oh!
      I can feel new chapters opening. Level {old_cap} was just the preface — the
      real story begins now!'
    is_defeated: Alice stumbles, clutching her side. 'The words... the words are
      fading. Is this... is this the end of the chapter?' She collapses, still reaching
      for her teacup.
    is_recovered: Alice blinks. 'Oh! I'm back. Was I gone long? It felt like I was
      falling. But... sideways.' She picks up her teacup. It's still warm.

wonderland_red_hood:
  name: Red Hood
  race: Beast
  secondary_race: Storybook
  level: 1
  base_hp: 24
  mods:
    Strength: 3
    Dexterity: 3
    Constitution: 2
    Wisdom: -1
    Charisma: 1
    Learning: 0
  boss: false
  super_boss: false
  _heroine: red_hood
  _heroine_passive: woodcutter_training
  dialogue:
    capture: Red Hood studies you for a long moment. Then she shoulders her axe.
      'Fine. But I'm not some damsel you rescued. I'm here because I CHOOSE to be.
      Don't make me regret it.'
    recruit_denied: Red Hood doesn't look up from her whetstone. 'I don't follow
      just anyone. Prove you can handle yourself first. The woods don't suffer fools
      — and neither do I.'
    recruit_accepted: Red Hood stands, axe coming up to rest on her shoulder. 'Good.
      Don't get in my way, and I won't get in yours. Fair warning — I don't trust
      easily. Stories have a way of betraying you.'
    house_talk_low: Red Hood sharpens her axe with slow, deliberate strokes. Shhhk.
      Shhhk. She doesn't look up. 'If you've got something to say, say it. I don't
      do small talk.'
    house_talk_mid: Red Hood glances up from her work. 'You're still here. Most
      people leave when they realize I'm not... soft. That I don't know how to be
      gentle.' She pauses. 'But you stayed.'
    house_talk_high: Red Hood sets her axe aside — a rare gesture. 'Grandmother
      always said I'd find someone who wasn't afraid of the woods. I thought she
      was just being kind. But you... you really aren't afraid, are you?'
    house_talk_max: Red Hood takes off her hood — a gesture of vulnerability you've
      never seen from her. 'The Wolf ate my story's ending. But you... you gave me
      a new one. A better one. One where I choose who I walk through the woods with.'
    house_talk_engaged_1: Red Hood turns her engagement ring in the light. 'I never
      thought I'd wear something like this. It's not practical. It wouldn't stop
      a blade. But every time I look at it, I remember that someone chose ME.'
    house_talk_engaged_2: Red Hood is baking bread — Grandmother's recipe. The kitchen
      smells amazing. 'Don't tell anyone about this,' she says gruffly. 'I have a
      reputation to maintain. But... you're worth breaking it for.'
    house_gift_love: Red Hood holds the gift carefully, as if it might break. She
      doesn't treat many things that way. 'This is... Grandmother would have loved
      this. Where did you find it?' Her voice is rough. 'You actually listen. That's
      rarer than you think.'
    house_gift_hate: Red Hood turns the gift over in her hands. 'Pretty. Useless,
      but pretty.' She sets it aside. 'I'll put it somewhere safe.' You suspect
      'somewhere safe' means 'somewhere I won't have to look at it.'
    house_buff: Red Hood rests the flat of her axe blade on your shoulder — a woodsman's
      benediction. 'There. Now the forest knows you're under my protection. The trees
      will whisper warnings. The path will clear before you. And the wolves... the
      wolves will think twice.'
    house_bond_kiss: Red Hood goes rigid. For a terrifying moment, you think she's
      going for her axe. Then she exhales — a long, shaky breath. 'No one's ever...'
      She doesn't finish. Instead, she kisses you back. Hard. 'Don't you dare get
      eaten by anything. That's an order.'
    house_engaged: Red Hood stares at the ring. Then at you. Then at the ring again.
      'Is this a trick? Some kind of storybook magic?' You shake your head. Her voice
      cracks — 'Then yes. A thousand times yes. But I'm keeping the axe. And the hood.
      And you're not allowed to get eaten. Ever. Those are my conditions.'
    house_special_gift: Red Hood hands you a small bundle wrapped in oilcloth. Inside —
      a strip of crimson fabric, still warm. 'A piece of my hood. As long as you
      wear it, I'll always find my way back to you. No matter how dark the woods
      get.' She ties the Crimson Clasp around your wrist. 'There. Now you're pack.
      And pack doesn't leave pack behind.'
    ascension_pre_ceremony: Red Hood kneels, laying her axe before her. 'In the
      woods, you grow or you die. There's no standing still. I've stood still at
      Level {old_cap} for too long. It's time to grow.'
    ascension_post_ceremony: The {stone} shatters like ice under a woodsman's axe!
      {name} rises, rolling her shoulders as old limits fall away. 'Ha! Level {old_cap}
      was a cage. Now I'm free. The hunt continues — and nothing can stop us.'
    is_defeated: Red Hood drops to one knee, using her axe to keep herself upright.
      'Grandmother... I'm sorry...' She collapses, still gripping the handle.
    is_recovered: Red Hood sits up sharply, hand already reaching for her axe. 'How
      long was I out? What did I miss? Is it dead?' She's on her feet before you
      can answer.

wonderland_dorothy:
  name: Dorothy
  race: Human
  secondary_race: Storybook
  level: 1
  base_hp: 22
  mods:
    Charisma: 3
    Wisdom: 3
    Constitution: 2
    Dexterity: 2
    Strength: 0
    Learning: 2
  boss: false
  super_boss: false
  _heroine: dorothy
  _heroine_passive: totos_nose
  dialogue:
    capture: Dorothy looks at you with wide, trusting eyes. Toto barks once — his
      vote is clear. 'Well, Toto says you're okay. And Toto's never wrong about people.
      I guess... I guess I'm coming with you!'
    recruit_denied: Dorothy's face falls, but she nods bravely. 'I understand. You
      probably have important things to do. Toto and I will wait here. The road isn't
      going anywhere. It never does.'
    recruit_accepted: Dorothy stands, slinging her bag over her shoulder. Toto jumps
      up, suddenly very awake. 'I've been walking this road alone for so long. It'll
      be nice to have company. Real company. Let's go!'
    house_talk_low: Dorothy sits by the window, looking out at the unfamiliar sky.
      'The stars are different here. Back in Kansas, I knew all their names. Here...
      here I'm still learning.' She smiles bravely.
    house_talk_mid: Dorothy is humming something — an old song about rainbows and
      bluebirds. 'Aunt Em used to sing this when I couldn't sleep. It always made
      me feel safe. I hope it makes you feel safe too.'
    house_talk_high: Dorothy scratches behind Toto's ears. 'You know what I realized?
      Home isn't a place. It's people. Aunt Em was home. Toto is home. And... and
      you're starting to feel like home too.'
    house_talk_max: Dorothy takes out her ruby slippers. She looks at them for a
      long moment. Then she puts them back in her bag. 'I could go home now. I can
      feel it. But my home doesn't have you in it. And that's not a home I want anymore.'
    house_talk_engaged_1: Dorothy gazes at her engagement ring, then at the ruby
      slippers on the table. 'The slippers don't glow anymore. I think they finally
      got me where I needed to go. Not to Kansas. To you.'
    house_talk_engaged_2: Dorothy is teaching Toto a new trick. 'Look! He can fetch
      my ring box now. Not the ring — I'd never risk that. But the box!' She laughs,
      and it's the warmest sound in any world.
    house_gift_love: Dorothy's eyes fill with happy tears. 'This is... this feels
      like home. I know that sounds silly — how can a THING feel like home? But this
      does. Thank you. Truly.' Toto barks his approval.
    house_gift_hate: Dorothy forces a smile. 'Oh. Um. That's... very green. The Wicked
      Witch wore a lot of green. I'm not fond of green.' She pats your arm. 'But
      thank you for thinking of me!'
    house_buff: Dorothy closes her eyes. 'There's no place like home,' she whispers.
      'And there's no one like you. May the road rise to meet you. May the wind be
      always at your back. And may you always, ALWAYS find your way back.'
    house_bond_kiss: Dorothy's cheeks flush bright red. Toto barks — once, sharply,
      as if to say 'finally!' 'Oh my,' she breathes. 'That was... that was better
      than a Kansas sunrise. And I REALLY like Kansas sunrises.'
    house_engaged: Dorothy's hands fly to her mouth. The ruby slippers on the table
      begin to glow — faintly, softly. 'You're asking me to stay? HERE? With YOU?'
      Tears — happy tears — spill down her cheeks. 'Yes. A thousand times yes. I
      don't need three clicks. I don't need a wizard. I just need you.'
    house_special_gift: Dorothy hands you a small velvet pouch. Inside — a tiny pair
      of ruby slippers on a silver chain. 'These are a replica. The originals only
      work for me. But these will remind you that you always have a way home — because
      home is wherever we are. Together.'
    ascension_pre_ceremony: Dorothy kneels, folding her hands like she's saying grace.
      'Back in Kansas, we believed that if you worked hard and kept faith, anything
      was possible. I've worked hard. I've kept faith. Now please — help me break
      through Level {old_cap}.'
    ascension_post_ceremony: The {stone} bursts into a thousand points of golden
      light — like a Kansas sunset! {name} rises, her ruby slippers flashing. 'Oh!
      Level {old_cap} is gone — there's no place like beyond! Thank you!'
    is_defeated: Dorothy stumbles, Toto whimpering at her side. 'Aunt Em... I'm
      sorry... I tried to be brave...' She sinks to her knees, clutching Toto close.
    is_recovered: Dorothy stirs. 'Aunt Em? Is that — oh. Oh, it's you. I was dreaming
      about Kansas. About home. But you know what? I'm glad I woke up here instead.'
      Toto licks her face happily.
