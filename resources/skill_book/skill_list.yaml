heroine_passives:
  wonderland_logic:
    id: wonderland_logic
    name: Wonderland Logic
    description: +1 Wisdom per Storybook enemy on the field.
    effect:
      type: scaling_stat
      stat: Wisdom
      per_enemy_race: Storybook
      value: 1
  woodcutter_training:
    id: woodcutter_training
    name: Woodcutter Training
    description: +1 Strength per consecutive attack on the same target (max +3).
