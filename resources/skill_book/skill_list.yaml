      type: consecutive_attack_bonus
      stat: Strength
      value: 1
      max_stacks: 3
  totos_nose:
    id: totos_nose
    name: Toto's Nose
    description: +15% chance to find non-combat rooms (fountain, treasure, merchant) in the dungeon.
    effect:
      type: non_combat_room_chance
      value: 0.15
  vorpal_instinct:
    id: vorpal_instinct
    name: Vorpal Instinct
    description: +20% damage vs Dragonkin and Storybook races. (Permanent unlock)
    effect:
      type: damage_bonus_vs_race
      races:
      - Dragonkin
      - Storybook
      value: 0.20
  grandmothers_lesson:
    id: grandmothers_lesson
    name: Grandmother's Lesson
    description: Immune to Fear. +10% crit chance vs Beasts and Abominations. (Permanent unlock)
    effect:
      type: multi
      effects:
      - type: fear_immunity
      - type: crit_bonus_vs_race
        races:
        - Beast
        - Abomination
        value: 0.10
  somewhere_over_rainbow:
    id: somewhere_over_rainbow
    name: Somewhere Over the Rainbow
    description: Party gains +10% XP from all sources. (Permanent unlock)
    effect:
      type: xp_boost
      value: 0.10
      target: party
  living_pigment:
