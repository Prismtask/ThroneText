          unlock_level: 50
          cooldown: 5
          target: enemies
          power_type: str
          base_power: 16
          apply_sunder: true
          sunder_value: 4
          sunder_duration: 3
          elemental: physical
        war_wl_reign:
          name: Warlord's Reign
          description: Mark every enemy — all of your party's attacks deal +30% damage to them for 4 turns.
          unlock_level: 60
          cooldown: 8
          target: enemies
          elemental: physical
    sentinel:
      name: Sentinel
      tagline: Become the wall the party stands behind.
      passive:
        id: war_passive_sentinel
        name: Living Bulwark
        description: Your Constitution is permanently increased by 4, and you take 10% less damage.
        effects:
        - stat: Constitution
          value: 4
        - type: damage_reduction
          value: 0.10
      skills:
        war_sent_guardian_stance:
          name: Guardian Stance
          description: Damage taken -6 and attackers suffer 25% backlash for 3 turns.
          unlock_level: 40
          cooldown: 6
          target: self
          elemental: physical
        war_sent_living_fortress:
          name: Living Fortress
          description: The whole party takes 4 less damage per hit for 3 turns.
          unlock_level: 50
