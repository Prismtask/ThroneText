professions:
  Warrior:
    warlord:
      name: Warlord
      tagline: Command the field — the party fights harder under your banner.
      passive:
        id: war_passive_warlord
        name: Commanding Presence
        description: Your Strength and Constitution are permanently increased by 2.
        effects:
        - stat: Strength
          value: 2
        - stat: Constitution
          value: 2
      skills:
        war_wl_iron_command:
          name: Iron Command
          description: The party deals +15% damage and stands immune to fear for 3 turns.
          unlock_level: 40
          cooldown: 6
          target: all_allies
          elemental: physical
        war_wl_decimation:
          name: Decimation
