child_talk_low:
- She is still deciding how much of herself to show you. Today, it is a small story about the garden.
- You sit together while she works. She does not say much, but she does not leave.
- She asks a careful question about your day, then listens to the whole answer.
child_talk_mid:
- She shows you something she made — rough, careful, proud. You make room for it on the shelf.
- She tells you a joke she has been saving. It is not very good. You laugh anyway.
- She leans against your shoulder for a moment, then pretends she did not.
child_talk_high:
- She talks about the future as if you are certain to be in it. You decide to be worthy of that.
- She calls you her family without hesitating. The word settles warmly in the room.
- She falls asleep mid-sentence, trusting you to be there when she wakes.
child_gift_love:
- Her eyes go wide. She turns the gift over and over, then hugs it to her chest.
- She tries to thank you formally, fails, and hugs you instead.
- She puts the gift somewhere safe, then comes back to sit closer.
child_gift_hate:
- She accepts it politely, but you can tell it is not for her. She keeps it anyway.
- She thanks you and sets it aside. Next time, you will ask first.
child_race_talk:
  Goblin:
    low:
    - She counts her coin collection and asks if you want to see the best one.
    mid:
    - She shows you a shiny button she found and explains why it is lucky.
    high:
    - She tells you a secret plan for the house and makes you swear not to tell.
  Beast:
    low:
    - She brings you a feather she found and waits for your verdict.
    mid:
    - She curls up against your side and listens to the house settle.
    high:
    - She falls asleep with her head in your lap, purring without meaning to.
  Fey:
    low:
    - She grows a flower in a cracked cup and checks whether you noticed.
    mid:
    - She asks why the moths come to the window and listens to the whole answer.
    high:
    - She makes the room smell like rain and wildflowers just before you enter.
  Dragonkin:
    low:
    - She shows you a scale she polished until it shone.
    mid:
    - She practices a proud stance, then asks if it looked convincing.
    high:
    - She curls her tail around your ankle and tells you about her hoard.
  Shadow:
    low:
    - She practices stepping through your shadow and nearly gets it right.
    mid:
    - She tells you a story about the dark that is not frightening at all.
    high:
    - She leaves a warm shadow on your pillow and pretends it was nothing.
  Elemental:
    low:
    - She changes colour when she is happy and hopes you did not see.
    mid:
    - She makes a small, warm light in her palm and holds it out to you.
    high:
    - She settles into your side like weather that has decided to stay.
  Lizardfolk:
    low:
    - She basks on the warm stone and saves you the sunny spot.
    mid:
    - She flicks her tongue out at the rain and decides it is acceptable.
    high:
    - She curls her tail around yours and tells you the house is warm enough now.
  Abomination:
    low:
    - She asks why she has extra eyes and trusts you to answer honestly.
    mid:
    - She shows you how many things she can look at at once.
    high:
    - She leans all her strange, sharp weight against you and calls it home.
  Construct:
    low:
    - She tightens a loose bolt on her wrist and asks you to check it.
    mid:
    - She stands very still while you work, then hums a small thank-you.
    high:
    - She tells you that her favourite sound is the house at night.
  Vampire:
    low:
    - She drinks her juice from a cup with a lid and avoids your eyes.
    mid:
    - She reads aloud from a book and does all the dramatic voices.
    high:
    - She takes your hand and tells you she is not hungry when you are near.
  Undead:
    low:
    - She asks what the sun feels like and listens without flinching.
    mid:
    - She makes the candle flames dance and laughs at her own trick.
    high:
    - She rests her cold hand in yours and says the house feels alive.
  Human:
    low:
    - She asks about your day and remembers the small parts.
    mid:
    - She tells you a joke from school and waits for the laugh.
    high:
    - She says she is glad you are her family, then hides under the blanket.
  Demon:
    low:
    - She practices her fearsome roar and is pleased when you pretend to fear it.
    mid:
    - She shows you a drawing of the two of you with tiny horns on you.
    high:
    - She curls against you, all her fire banked to a safe warmth.
  Giant:
    low:
    - She ducks under the doorway and asks if she will ever stop growing.
    mid:
    - She lifts you onto her shoulder to reach the high shelf.
    high:
    - She sits on the floor so you can reach her, and stays.
  Orc:
    low:
    - She challenges you to arm-wrestle and loses with great drama.
    mid:
    - She shows you a bruise and asks if it looks impressive.
    high:
    - She rests her forehead to yours and says nothing at all.
  Clockwork:
    low:
    - She winds herself up and asks you to listen to the tick.
    mid:
    - She recites the house rules in perfect order, then adds one of her own.
    high:
    - She slows her gears to match your breathing without being asked.
  Angel:
    low:
    - She sings to the houseplants and checks if you are listening.
    mid:
    - She folds her wings small so she fits beside you.
    high:
    - She tells you the house feels like a blessing and means it.
  Gnome:
    low:
    - She takes apart a clock and promises to put it back together.
    mid:
    - She shows you a tiny machine that opens and closes a little door.
    high:
    - She falls asleep on your workbench, still holding a screwdriver.
  Storybook:
    low:
    - She asks for a story and corrects your voices.
    mid:
    - She draws a map of a place that does not exist and invites you.
    high:
    - She reads aloud until you both forget who is listening.
child_race_gift:
  Goblin:
    love:
    - She adds it to her hoard and gives you the best piece in return.
    hate:
    - She tries to trade it for something shinier.
  Beast:
    love:
    - She tucks it into her nest and curls around it.
    hate:
    - She sniffs it once and loses interest.
  Fey:
    love:
    - She ties it to a branch and calls it a garden treasure.
    hate:
    - She thanks you and lets the moths inspect it instead.
  Dragonkin:
    love:
    - She polishes it and places it with her hoard.
    hate:
    - She tries to look impressed, then hides it.
  Shadow:
    love:
    - She keeps it in a shadow-wrapped box.
    hate:
    - She leaves it somewhere dark and forgets it.
  Elemental:
    love:
    - She glows a little and does not hide it.
    hate:
    - She turns it over, then sets it gently aside.
  Lizardfolk:
    love:
    - She places it on the warm stone where she naps.
    hate:
    - She gives it a polite lick and hands it back.
  Abomination:
    love:
    - She lets all her eyes look at it at once.
    hate:
    - She asks what it is. She is not being cruel.
  Construct:
    love:
    - She displays it on her workbench with precision.
    hate:
    - She logs it as 'received' and sets it aside.
  Vampire:
    love:
    - She keeps it in a velvet box under her bed.
    hate:
    - She thanks you with a smile that does not reach her eyes.
  Undead:
    love:
    - She places it where the candlelight hits it.
    hate:
    - She says it is lovely, then puts it away.
  Human:
    love:
    - She hugs it and then hugs you.
    hate:
    - She says thank you and tries to mean it.
  Demon:
    love:
    - She declares it the finest tribute she has ever received.
    hate:
    - She calls it a mortal custom and hides it carefully.
  Giant:
    love:
    - She holds it in one hand like a treasure.
    hate:
    - She thanks you and puts it on the highest shelf.
  Orc:
    love:
    - She grins and shows it off to the empty room.
    hate:
    - She grunts, then gives it to someone who wanted it.
  Clockwork:
    love:
    - She records it as 'kept' in her little ledger.
    hate:
    - She records it as 'reviewed' and files it away.
  Angel:
    love:
    - She holds it to the light and blesses it.
    hate:
    - She thanks you and gives it to the house shrine.
  Gnome:
    love:
    - She puts it on her workbench where she can see it.
    hate:
    - She tries to improve it with a screwdriver.
  Storybook:
    love:
    - She writes it into the margin of her favourite page.
    hate:
    - She says it belongs in a different story.
