# resources/family_scenes.yaml
# All Shared Night, child-bond, and birth scene text.
# Edit this file to tune dialogue; resources/family_scenes.py loads it.
# Per-girl keys use the monster-girl template key (e.g. harpy_scout).
action_prompts:
  tender: Hold her close — slow and warm
  playful: Play along — tease her, make her laugh
  bold: Take the lead — meet her boldly
  shy: Whisper — soft words, no hurry
  end: End the night — just rest together
action_lines:
  tender:
  - You draw {name} close; she settles against you like she has been waiting for the invitation.
  - Her shoulder relaxes under your hand. The room goes quiet in the good way.
  - You hold her without hurry. She counts your heartbeat with one palm.
  - She tucks her head beneath your chin and lets out a breath she has been holding all day.
  - She fits herself into the curve of your shoulder, and the last of the day drains out of her.
  - You smooth her hair back; she closes her eyes and leans into the touch.
  - For a while neither of you speaks. The silence is doing the work.
  - She takes your hand and presses it flat over her heart, as if to prove something.
  playful:
  - You tease her gently; she swats your shoulder, laughing.
  - A sly remark earns you a narrowed look and a smile she tries to hide.
  - You make her laugh — really laugh — and the sound settles warmly between you.
  - She threatens to push you off the bed. She does not.
  - You steal the blanket; she declares war with a pillow and terrible aim.
  - She challenges you to a staring contest and loses because she keeps laughing.
  - You trade increasingly ridiculous stories until neither of you can breathe.
  - She draws a face on your hand and dares you to leave it there.
  bold:
  - You meet her gaze and do not look away. She does not either.
  - Your hand finds hers; she laces her fingers through yours and pulls.
  - You close the distance first. She makes a small, surprised sound and leans in.
  - There is nothing tentative about the way she answers you.
  - You take her hand and pull her gently into your space; she comes willingly.
  - She tilts her head, waiting. You answer by closing the distance.
  - You tell her what you want. Her smile sharpens with interest.
  - She starts to speak; you kiss her instead, and she does not complain.
  shy:
  - You murmur something only she can hear. Her ear tips toward you.
  - You tell her a small, true thing. She answers with a softer one.
  - Your voice drops; she leans in until the words are almost not needed.
  - You whisper her name like a promise. She goes still, listening.
  - You ask permission with a look. She answers with a small nod.
  - She reaches for your sleeve and holds on, saying nothing.
  - You let her set the pace. She takes a breath and moves closer.
  - She confesses something in a whisper; you keep it safe.
mood_lines:
  tender:
  - She is quiet tonight, her hand resting in yours. She wants to be held close.
  - She leans against you without a word. Tonight she wants closeness, not talk.
  - She keeps finding reasons to touch your hand. Tonight she wants to be close.
  - Her voice is softer than usual, and she keeps looking at you like she is about to ask for something.
  playful:
  - There is a spark in her eye tonight. She is waiting for you to play along.
  - She keeps almost-laughing, watching you. She wants you to tease her back.
  - She is in a mood to be chased tonight, eyes bright with mischief.
  - She nudges your foot under the table and pretends it was an accident.
  bold:
  - She holds your gaze without flinching. She wants you to meet her halfway.
  - She is bold tonight, all sharp smiles and steady hands. She wants you to take the lead.
  - She has already decided what she wants. She is waiting for you to catch up.
  - There is no hesitation in her tonight, only a steady, warm challenge.
  shy:
  - She is shy tonight, her words careful and her eyes averted. She is listening for a soft word.
  - She keeps looking away, then back. She wants you to close the distance gently.
  - She keeps her hands folded, but her eyes keep returning to you.
  - She has something to say and is working up to it.
match_lines:
- Perfect — that is exactly what she wanted.
- She lights up; you read her right.
- Something clicks into place between you.
- She makes a small, pleased sound — you found the shape of her.
- That was the answer. Her whole posture changes.
compatible_lines:
- Close enough; she leans into it.
- Not exact, but the same language.
- She softens, willing to follow where you are going.
- It lands a little sideways, but she meets you there.
- Not the words she expected, but close enough to keep.
miss_lines:
- The moment slips; she humors you.
- You misread her, and the air cools a little.
- She tries, but the rhythm is not there.
- She blinks, recalculating. The moment needs a moment.
- You step on the punchline. She forgives you with a look.
random_beats:
- She shifts closer, her breathing evening out.
- A floorboard creaks; you both freeze, then laugh.
- Rain begins against the window. Neither of you mentions it.
- She traces a small pattern on your sleeve, thinking.
- The lamp gutters; the room settles into softer light.
- She asks a question she has been saving. You answer honestly.
- The house creaks around you, settling in for the night.
- She hums a few bars of something and stops when she notices you listening.
- A moth taps the window once, then goes still.
- She steals a sip of water and leaves the cup on your side.
- You compare hands. Hers are colder. She does not pull away.
- Somewhere down the hall, a door closes softly.
ending_lines:
  together:
  - The night finds its rhythm, and neither of you rushes the end. Afterward, the quiet holds you both.
  - You end up tangled together, breathing in time, and the morning feels very far away.
  - Whatever the morning brings, it will find you both here, together.
  - She stays awake a little longer just to watch you breathe.
  - You fall asleep at different times and wake up in the same place.
  - The night does not need to be perfect. It needs to be this.
  warm:
  - It is not perfect, but it is warm, and she stays close.
  - The night settles into something gentle. She falls asleep with her hand in yours.
  - 'You do not get everything right, but you get this: her, here, staying.'
  - She curls against your back and falls asleep mid-sentence.
  - You talk until the words run out, then stay anyway.
  - The lamp stays on. Neither of you wants to be the first to move.
  quiet:
  - The night is gentle rather than bright. She falls asleep first.
  - You lie together in comfortable silence, closer than before.
  - It is enough — quiet, and warm, and not quite what either of you hoped.
  - You listen to the house settle and her breathing slow.
  - She leaves her hand where you can reach it. You do.
  - The silence is not empty. It is shared.
  rest:
  - You hold each other until sleep takes you. It is enough.
  - The night passes in comfortable quiet. In the morning, she is still there.
  - You choose rest, and the quiet is its own kind of closeness.
  - 'You let the night be simple: warm, quiet, together.'
  - She sleeps first. You stay awake a little longer, listening.
  - Nothing more happens. That is the point.
ending_titles:
  together: Together
  warm: Warm
  quiet: Quiet
  rest: Rest
written_action_lines:
  tender:
  - You take your time. Her hands find the small of your back; the kiss deepens by degrees, and neither of you hurries to end it.
  - She presses closer until there is no polite distance left, only warmth and the sound of her breathing changing.
  - You take her face in both hands and kiss her slowly, giving her every chance to set the pace.
  - She melts against you by inches, her fingers curling into your shirt, and the room narrows to the two of you.
  - You let the kiss deepen until the only thing left is warmth, breath, and the weight of her against you.
  playful:
  - Her laugh turns into a gasp against your mouth. The teasing stops being a game somewhere between one kiss and the next.
  - She hooks a leg around yours and pulls you off balance, grinning, already reaching for the lamp.
  - She laughs into the kiss, then stops laughing. Her hands are already at your collar.
  - You catch her wrist, pull her back, and kiss her until the teasing runs out of both of you.
  - She pushes you down first, triumphant, and then forgets to be smug.
  bold:
  - You let your hands answer for you. She arches into the touch, eyes dark, and does not look away.
  - She pulls you down beside her and makes her expectations clear — softly, but without a trace of doubt.
  - You hold her gaze while your hands learn her, slow and deliberate. She lets you see exactly what it does to her.
  - She pulls you close by the belt and kisses you like she has decided the night is hers.
  - You answer her challenge without words. She stops pretending she is in control.
  shy:
  - You keep your voice low and your hands gentle. She leans in to hear, then stays for the kiss.
  - She hesitates at the edge of the bed, then reaches for you first. The lamp goes out.
  - You brush her hair back and ask, quietly. She says yes before you finish the question.
  - She kisses you first — clumsily, bravely — and you let her lead.
  - You keep the lamp low and your touches gentle. She stays close enough to hear your heartbeat.
written_ending_lines:
  together:
  - Afterward you lie tangled together, breath slowing, her hand still open on your chest.
  - The night narrows to warmth and closeness. She falls asleep against you, and you let yourself follow.
  - You stay awake in the dark, memorizing the weight of her, and let the night take its time.
  - In the morning neither of you moves first. There is nowhere else either of you wants to be.
  warm:
  - 'You do not get everything right, but you get this: her, close, staying. The rest can wait for morning.'
  - She kisses your shoulder and settles. The lamp burns low; neither of you reaches to put it out.
  - She falls asleep with her hand on your chest. You cover it with yours and let the lamp burn.
  - It was not perfect. It was real, and warm, and she is still here.
  quiet:
  - The night is gentler than either of you expected. She stays close, and that is enough.
  - You lie together in the dark, not speaking, not apart.
  - You hold each other without asking for more. The quiet settles in around you both.
  - She sleeps first. You stay awake a little longer, listening to the house and her breathing.
  rest:
  - You hold her until sleep takes you both. Nothing more needs to happen tonight.
  - The night passes in quiet closeness. In the morning, she is still there.
  - You let the night be simple. That is enough.
  - She sleeps; you follow. In the morning, neither of you regrets the quiet.
