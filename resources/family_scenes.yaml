birth_lines:
- The house is quiet when {mother} calls for you. The lamp is low; her hand finds yours.
- She is tired, but her smile is steady. The child in her arms is small and warm and real.
- You sit together for a long time, none of you saying much. The house seems to hold its breath around you.
birth_name_prompt: What will you name the child?
