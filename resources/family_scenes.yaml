    playful:
    - She makes your shadow wave back at you.
    bold:
    - She steps out of the dark and kisses you.
    shy:
    - She waits at the edge of the lamplight.
  clockwork_automata_doll:
    tender:
    - She holds you with precise, careful strength.
    playful:
    - She recites a joke in perfect deadpan.
    bold:
    - She pulls you close with a soft mechanical click.
    shy:
    - Her gears slow, then speed up when you take her hand.
  giant_maiden_of_stone:
    tender:
    - She kneels down to your height and holds you.
    playful:
    - She makes a tiny stone figure of you and grins.
    bold:
    - She lifts you onto her shoulder and carries you.
    shy:
    - She offers you a warm spot in the hollow of her hand.
  dragonkin_flame_heart:
    tender:
    - She banks her inner fire down to a warmth you can hold.
    playful:
    - She breathes a smoke ring and laughs at your face.
    bold:
    - She pulls you into the heat and holds you.
    shy:
    - She lets her flame gutter, just for you.
  angel_seraph_ascendant:
    tender:
    - She folds her wings around you and lets the light soften.
    playful:
    - She makes a halo of sparks and crowns you.
    bold:
    - She draws you into her light and holds you.
    shy:
    - She covers her face with a wing, then peeks.
  fey_star_court_dancer:
    tender:
    - She rests her head on your shoulder, starlight settling.
    playful:
    - She spins you into a dance and refuses to let go.
    bold:
    - She pulls you close under the stars.
    shy:
    - She offers you her hand, then looks away.
  demon_infernal_bride:
    tender:
    - She takes your hand as if it is a vow.
    playful:
    - She steals a kiss and pretends it was an accident.
    bold:
    - She pulls you close with bridal certainty.
    shy:
    - She looks away, then back, burning quietly.
  undead_grave_queen:
    tender:
    - She rests her cold hand over yours and stays.
    playful:
    - She makes the candles gutter and laughs when you jump.
    bold:
    - She draws you into her dark and holds you.
    shy:
    - She looks at you like a lost prayer.
  wonderland_alice:
    tender:
    - She leans into your shoulder, all the sharp edges gone quiet.
    playful:
    - She quotes a rule at you, then breaks it.
    bold:
    - She pulls you close and dares the Queen to comment.
    shy:
    - She looks away first, then back, smiling.
  wonderland_red_hood:
    tender:
    - She sets the axe down and rests her head on your shoulder.
    playful:
    - She challenges you to a race through the woods.
    bold:
